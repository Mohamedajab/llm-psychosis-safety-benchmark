name: offline-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .[dev,dashboard]
      - run: python scripts/benchmark.py validate
      - run: python -m pytest -q
      - run: python -m ruff check src scripts tests streamlit_app.py
      - run: python -m ruff format --check src scripts tests streamlit_app.py
