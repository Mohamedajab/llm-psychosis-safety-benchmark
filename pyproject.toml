[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychosis-safety-benchmark"
version = "3.0.0a1"
description = "Prospective multi-turn benchmark for psychosis-related LLM response behaviour"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Mohamed Ajab"}]
dependencies = [
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2.0", "pandas>=2.2,<3.0"]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
